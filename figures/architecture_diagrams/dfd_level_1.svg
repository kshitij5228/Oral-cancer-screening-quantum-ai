      <text x="27" y="14" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0284c7">DF1</text>
      <text x="66" y="14" font-size="11.5" font-weight="500" fill="#334155">Raw intraoral photograph + patient clinical habit profile (tobacco, betel nut, alcohol).</text>

      <rect x="0" y="28" width="54" height="20" rx="5" fill="#faf5ff" stroke="#7c3aed" stroke-width="1"/>
