    <text x="14" y="54" font-size="11.5" font-weight="700" fill="#0284c7">DF8: Structured FHIR/HL7 Package</text>
    <text x="14" y="72" font-size="11" font-weight="500" fill="#334155">• Machine-Readable Diagnostic JSON Payload</text>
    <text x="14" y="88" font-size="11" font-weight="500" fill="#334155">• Longitudinal Patient Surveillance Records</text>
    <text x="14" y="104" font-size="11" font-weight="600" fill="#0284c7">• Checksum Verification &amp; Cancer Registry Sync</text>
  </g>

  <!-- ================= 8. SYSTEM DATA FLOW DIRECTORY TABLE (BOTTOM) ================= -->
  <g transform="translate(80, 970)">
    <rect width="1040" height="196" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="520" y="25" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">DFD Level 1 System Data Flow Directory (Complies with IEEE 1471 &amp; Gane-Sarson Standards)</text>
    
    <!-- LEFT COLUMN -->
    <g transform="translate(30, 48)">
