      <text x="66" y="42" font-size="11.5" font-weight="500" fill="#334155">Quality-verified normalized image tensors at dual scales (384×384 and 300×300).</text>

      <rect x="0" y="56" width="54" height="20" rx="5" fill="#faf5ff" stroke="#7c3aed" stroke-width="1"/>
      <text x="27" y="70" text-anchor="middle" font-size="10.5" font-weight="800" fill="#7c3aed">DF3</text>
      <text x="66" y="70" font-size="11.5" font-weight="500" fill="#334155">256-D projected classical features (128-D ConvNeXt spatial + 128-D EfficientNet cellular).</text>

      <rect x="0" y="84" width="54" height="20" rx="5" fill="#faf5ff" stroke="#7c3aed" stroke-width="1"/>
      <text x="27" y="98" text-anchor="middle" font-size="10.5" font-weight="800" fill="#7c3aed">DF4</text>
      <text x="66" y="98" font-size="11.5" font-weight="500" fill="#334155">72-D late hybrid feature representation vector (8-D VQC Hilbert state + 64-D Bypass).</text>

      <rect x="0" y="112" width="54" height="20" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
      <text x="27" y="126" text-anchor="middle" font-size="10" font-weight="800" fill="#dc2626">Alert</text>
      <text x="66" y="126" font-size="11.5" font-weight="500" fill="#dc2626">Laplacian blur (&lt; 100.0) / glare pre-flight rejection alert triggering image retake.</text>
