  </defs>

  <!-- ================= 0. HEADER ================= -->
  <g transform="translate(150, 24)">
    <rect width="900" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Data Flow Diagram (DFD) — Level 1 : Subsystem Architecture</text>
    <text x="450" y="50" text-anchor="middle" font-size="12.5" font-weight="500" fill="#64748b">QAI-OLI Clean Hierarchical Pipeline: Ingestion → Dual Feature → VQC Decoupler → Cascade → Reporting</text>
  </g>

  <!-- ================= 1. EXTERNAL INPUT (TOP) ================= -->
  <g transform="translate(340, 110)">
    <rect width="520" height="66" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <rect x="16" y="14" width="90" height="20" rx="10" fill="#e0f2fe"/>
    <text x="61" y="28" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0369a1">ENTITY E1</text>
    <text x="118" y="29" font-size="14.5" font-weight="700" fill="#0369a1">Primary Healthcare Screener &amp; Patient Ingestion</text>
    <text x="16" y="52" font-size="11.5" font-weight="500" fill="#475569">Direct 2D RGB Intraoral Photo + Clinical Risk Survey (Tobacco, Alcohol, Lesion Site)</text>
  </g>

  <!-- Flow E1 -> 1.0 -->
  <line x1="600" y1="176" x2="600" y2="216" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <rect x="475" y="184" width="250" height="26" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
  <text x="600" y="201" text-anchor="middle" font-size="11" font-weight="700" fill="#0284c7">DF1: Raw Image &amp; Patient Metadata</text>

  <!-- ================= 2. PROCESS 1.0: IQA QUALITY GATE ================= -->
  <g transform="translate(340, 218)">
    <rect width="520" height="76" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="16" y="14" width="100" height="20" rx="10" fill="#ede9fe"/>
    <text x="66" y="28" text-anchor="middle" font-size="10.5" font-weight="800" fill="#6d28d9">PROCESS 1.0</text>
    <text x="126" y="29" font-size="15" font-weight="700" fill="#4c1d95">Pre-Flight Image Quality Gate (IQA)</text>
    <text x="16" y="52" font-size="11.5" font-weight="500" fill="#475569">• Laplacian Variance Blur Filter (Var &gt; 100.0) &amp; Histogram Exposure Check</text>
    <text x="16" y="68" font-size="11.5" font-weight="600" fill="#7c3aed">• Normalizes &amp; resizes image to dual scales: 384×384 (ConvNeXt) &amp; 300×300 (EffNet)</text>
  </g>

  <!-- Side-Rejection Alert (Process 1.0 -> Left) -->
  <path d="M 340 256 L 190 256" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="70" y="240" width="220" height="32" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="180" y="260" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">DF_Alert: Quality Fail (Retake Alert)</text>

  <!-- Flow 1.0 -> 2.0 -->
  <line x1="600" y1="294" x2="600" y2="334" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arr-purple)"/>
  <rect x="475" y="302" width="250" height="26" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="600" y="319" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">DF2: Validated Dual-Scale Tensors</text>

  <!-- ================= 3. PROCESS 2.0: DUAL-BACKBONE FEATURE EXTRACTION ================= -->
  <g transform="translate(340, 336)">
    <rect width="520" height="76" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="16" y="14" width="100" height="20" rx="10" fill="#ede9fe"/>
    <text x="66" y="28" text-anchor="middle" font-size="10.5" font-weight="800" fill="#6d28d9">PROCESS 2.0</text>
    <text x="126" y="29" font-size="15" font-weight="700" fill="#4c1d95">Dual-Backbone Feature Extractor</text>
    <text x="16" y="52" font-size="11.5" font-weight="500" fill="#475569">• ConvNeXt-V2-Tiny (768-D Spatial Margin) + EfficientNet-B3 (1536-D Cellular)</text>
    <text x="16" y="68" font-size="11.5" font-weight="600" fill="#7c3aed">• Matched Linear Projections: 128-D + 128-D → 256-D Fused Latent Embedding</text>
  </g>

