    <rect x="14" y="14" width="90" height="20" rx="10" fill="#ede9fe"/>
    <text x="59" y="28" text-anchor="middle" font-size="10.5" font-weight="800" fill="#6d28d9">DESTINATION 2</text>
    <text x="114" y="29" font-size="14" font-weight="700" fill="#4c1d95">Oral Oncologist &amp; Pathologist</text>
    <text x="14" y="54" font-size="11.5" font-weight="700" fill="#7c3aed">DF7: Explainable AI (XAI) Dossier</text>
    <text x="14" y="72" font-size="11" font-weight="500" fill="#334155">• Real-Time Grad-CAM Saliency Overlays</text>
    <text x="14" y="88" font-size="11" font-weight="500" fill="#334155">• Quantum Polarization Score (QPS Ambiguity Index)</text>
    <text x="14" y="104" font-size="11" font-weight="600" fill="#6d28d9">• Evidence-Based Surgical &amp; Biopsy Decision Aid</text>
