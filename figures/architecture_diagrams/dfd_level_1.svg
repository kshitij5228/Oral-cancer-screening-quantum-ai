    <rect x="14" y="14" width="90" height="20" rx="10" fill="#d1fae5"/>
    <text x="59" y="28" text-anchor="middle" font-size="10.5" font-weight="800" fill="#047857">DESTINATION 1</text>
    <text x="114" y="29" font-size="14" font-weight="700" fill="#065f46">Primary Healthcare Screener</text>
    <text x="14" y="54" font-size="11.5" font-weight="700" fill="#059669">DF6: 4-Class Diagnostic Action Protocol</text>
    <text x="14" y="72" font-size="11" font-weight="500" fill="#334155">• Healthy (Routine) | Benign (14-Day Surveillance)</text>
    <text x="14" y="88" font-size="11" font-weight="500" fill="#334155">• OPMD (Biopsy Priority) | OCA (Urgent Oncology)</text>
    <text x="14" y="104" font-size="11" font-weight="600" fill="#047857">• Calibrated Diagnostic Confidence Score</text>
