      <text x="27" y="14" text-anchor="middle" font-size="10.5" font-weight="800" fill="#7c3aed">DF5</text>
      <text x="66" y="14" font-size="11.5" font-weight="500" fill="#334155">Calibrated probabilities from Tri-Stage cascade ensemble (0.25 M1 + 0.25 M2 + 0.50 M3).</text>

      <rect x="0" y="28" width="54" height="20" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
      <text x="27" y="42" text-anchor="middle" font-size="10.5" font-weight="800" fill="#059669">DF6</text>
      <text x="66" y="42" font-size="11.5" font-weight="500" fill="#334155">Immediate 4-class clinical diagnostic triage protocol &amp; surveillance timeline.</text>

      <rect x="0" y="56" width="54" height="20" rx="5" fill="#faf5ff" stroke="#7c3aed" stroke-width="1"/>
      <text x="27" y="70" text-anchor="middle" font-size="10.5" font-weight="800" fill="#7c3aed">DF7</text>
      <text x="66" y="70" font-size="11.5" font-weight="500" fill="#334155">Real-time Grad-CAM visual attention overlays &amp; Quantum Polarization Score (QPS).</text>

      <rect x="0" y="84" width="54" height="20" rx="5" fill="#f0f9ff" stroke="#0284c7" stroke-width="1"/>
