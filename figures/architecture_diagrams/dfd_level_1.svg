    <text x="126" y="29" font-size="15" font-weight="700" fill="#4c1d95">Quantum VQC &amp; Classical Bypass</text>
    <text x="16" y="52" font-size="11.5" font-weight="500" fill="#475569">• Parallel VQC (8-Qubit AngleEmbedding, L=3 Ansatz) → 8-D Hilbert Output</text>
    <text x="16" y="68" font-size="11.5" font-weight="600" fill="#7c3aed">• Parallel Classical Residual Bypass (64-D) → Late Hybrid Concat (72-D Unified)</text>
