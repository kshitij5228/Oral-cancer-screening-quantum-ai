    <text x="104" y="27" font-size="13" font-weight="700" fill="#92400e">Model Checkpoints</text>
    <text x="14" y="52" font-size="11" font-weight="500" fill="#78350f">• 01_convnextv2_tiny.pth</text>
    <text x="14" y="70" font-size="11" font-weight="500" fill="#78350f">• 02_densenet121.pth</text>
    <text x="14" y="88" font-size="11" font-weight="500" fill="#78350f">• 03_quantum_8q_vqc.pth</text>
    <line x1="14" y1="102" x2="246" y2="102" stroke="#fde68a" stroke-width="1"/>
    <text x="14" y="122" font-size="10.5" font-weight="600" fill="#b45309">Read access for feature</text>
    <text x="14" y="138" font-size="10.5" font-weight="600" fill="#b45309">extraction &amp; VQC execution</text>
