  <!-- Fork Branches from Process 5.0 down to 3 Target Cards -->
  <path d="M 600 766 L 600 790 Q 600 802 585 802 L 230 802 Q 215 802 215 814 L 215 826" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-green)"/>
  <path d="M 600 766 L 600 826" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arr-purple)"/>
  <path d="M 600 766 L 600 790 Q 600 802 615 802 L 985 802 Q 1000 802 1000 814 L 1000 826" fill="none" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <!-- Card 1: Primary Screener (Left) -->
  <g transform="translate(60, 828)">
