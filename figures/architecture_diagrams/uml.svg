<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1360" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- ================= 0. HEADER ================= -->
  <g transform="translate(100, 30)">
    <rect width="760" height="74" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">QAI-OLI: Hybrid Quantum-Classical Diagnostic Architecture</text>
    <text x="380" y="56" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">ConvNeXt-V2 + DenseNet-121 with Parallel 8-Qubit VQC &amp; Classical Residual Bypass</text>
  </g>

  <!-- ================= 1. ORAL IMAGE INPUT ================= -->
  <g transform="translate(250, 134)">
    <rect width="460" height="76" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
    <rect x="20" y="16" width="44" height="44" rx="10" fill="#f1f5f9"/>
    <circle cx="42" cy="33" r="4" fill="#64748b"/>
    <path d="M 28 50 L 36 39 L 43 46 L 50 36 L 56 50 Z" fill="#64748b"/>
    <text x="80" y="36" font-size="16" font-weight="700" fill="#0f172a">Oral Photographic Image Input</text>
    <text x="80" y="56" font-size="12.5" font-weight="500" fill="#64748b">Non-Invasive 2D RGB Smartphone Capture (384×384 &amp; 224×224)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="480" y1="210" x2="480" y2="242" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- ================= 2. CLASSICAL DUAL BACKBONES ================= -->
  <g transform="translate(200, 244)">
    <rect width="560" height="116" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
    <text x="280" y="28" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0f172a">Classical Dual-Backbone Feature Extractors</text>
    
    <!-- ConvNeXt Card -->
    <rect x="24" y="42" width="246" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="40" y="64" font-size="13.5" font-weight="700" fill="#1e293b">ConvNeXt-V2-Tiny</text>
    <text x="40" y="82" font-size="11.5" font-weight="500" fill="#64748b">768-D → Proj: 128-D (Spatial &amp; Borders)</text>
    
    <!-- DenseNet Card -->
    <rect x="290" y="42" width="246" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="306" y="64" font-size="13.5" font-weight="700" fill="#1e293b">DenseNet-121</text>
    <text x="306" y="82" font-size="11.5" font-weight="500" fill="#64748b">1024-D → Proj: 128-D (Cellular &amp; Vascular)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="480" y1="360" x2="480" y2="392" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- ================= 3. EARLY FEATURE CONCATENATION ================= -->
  <g transform="translate(240, 394)">
    <rect width="480" height="70" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/>
    <text x="240" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Early Feature Concatenation</text>
    <text x="240" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">256-Dimensional Fused Latent Embedding [z_fused]</text>
  </g>

  <!-- Fork Branches from 3 to 4A (Quantum) and 5A (Classical) -->
  <path d="M 480 464 L 480 488 Q 480 500 465 500 L 255 500 Q 240 500 240 512 L 240 524" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#arr-purple)"/>
  <path d="M 480 464 L 480 488 Q 480 500 495 500 L 705 500 Q 720 500 720 512 L 720 524" fill="none" stroke="#0284c7" stroke-width="2.4" marker-end="url(#arr-blue)"/>

  <!-- ================= 4. PARALLEL QUANTUM BRANCH (PURPLE) ================= -->
  <!-- 4A. Quantum Encoder -->
  <g transform="translate(60, 526)">
    <rect width="360" height="84" rx="14" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <rect x="16" y="16" width="6" height="52" rx="3" fill="#7c3aed"/>
    <text x="34" y="38" font-size="14.5" font-weight="700" fill="#5b21b6">Quantum Angle Encoder</text>
    <text x="34" y="57" font-size="12.5" font-weight="600" fill="#6d28d9">Linear(256 → 8, bias=False) * π</text>
    <text x="34" y="74" font-size="11.5" font-weight="500" fill="#7c3aed">Rotation Angles θ ∈ (-π, π)⁸</text>
  </g>

  <!-- Arrow 4A -> 4B -->
  <line x1="240" y1="610" x2="240" y2="636" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- 4B. 8-Qubit VQC Ansatz -->
  <g transform="translate(60, 638)">
    <rect width="360" height="154" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    
    <rect x="16" y="14" width="136" height="22" rx="11" fill="#ede9fe"/>
    <text x="84" y="29" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">8-QUBIT VQC ANSATZ</text>
    
    <text x="16" y="55" font-size="14" font-weight="700" fill="#4c1d95">PennyLane Variational Circuit</text>
    
    <circle cx="24" cy="74" r="3" fill="#7c3aed"/>
    <text x="34" y="78" font-size="11.5" font-weight="500" fill="#374151">State Init: |0⟩^⊗8 via <tspan font-weight="700" fill="#6d28d9">AngleEmbedding(RY)</tspan></text>
    
    <circle cx="24" cy="96" r="3" fill="#7c3aed"/>
    <text x="34" y="100" font-size="11.5" font-weight="500" fill="#374151"><tspan font-weight="700" fill="#6d28d9">StronglyEntanglingLayers (L=3)</tspan> CNOT</text>
    
    <circle cx="24" cy="118" r="3" fill="#7c3aed"/>
    <text x="34" y="122" font-size="11.5" font-weight="500" fill="#374151">Measurement: <tspan font-weight="700" fill="#6d28d9">Pauli-Z Expectation ⟨Z_i⟩</tspan></text>

    <circle cx="24" cy="139" r="3" fill="#059669"/>
    <text x="34" y="143" font-size="11" font-weight="600" fill="#047857">Barren Plateau Mitigation: Ω ~ N(0, 0.1²)</text>
  </g>

  <!-- Arrow 4B -> 4C -->
  <line x1="240" y1="792" x2="240" y2="818" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- 4C. Quantum 8-D Output -->
  <g transform="translate(60, 820)">
    <rect width="360" height="66" rx="14" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="180" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">Quantum Branch Output</text>
    <text x="180" y="50" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">8-Dimensional Hilbert Projection [v_vqc]</text>
  </g>

  <!-- ================= 5. PARALLEL CLASSICAL BYPASS (BLUE) ================= -->
  <!-- 5A. Classical Residual Path -->
  <g transform="translate(540, 526)">
    <rect width="360" height="266" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    
    <rect x="16" y="14" width="144" height="22" rx="11" fill="#e0f2fe"/>
    <text x="88" y="29" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">RESIDUAL BYPASS</text>
    
    <text x="16" y="56" font-size="14.5" font-weight="700" fill="#0369a1">Classical Residual Bypass Branch</text>
    <text x="16" y="77" font-size="13" font-weight="600" fill="#0284c7">Linear(256 → 64)</text>

    <!-- Sub-card inside -->
    <rect x="16" y="94" width="328" height="106" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <circle cx="30" cy="116" r="3" fill="#0284c7"/>
    <text x="40" y="120" font-size="12" font-weight="500" fill="#334155"><tspan font-weight="700">LayerNorm(64)</tspan> for scale stability</text>
    
    <circle cx="30" cy="139" r="3" fill="#0284c7"/>
    <text x="40" y="143" font-size="12" font-weight="500" fill="#334155"><tspan font-weight="700">ReLU</tspan> Non-linear Activation</text>
    
    <circle cx="30" cy="162" r="3" fill="#0284c7"/>
    <text x="40" y="166" font-size="12" font-weight="500" fill="#334155"><tspan font-weight="700">Dropout(p=0.3)</tspan> Regularization</text>
    
    <circle cx="30" cy="184" r="3" fill="#0369a1"/>
    <text x="40" y="188" font-size="11.5" font-weight="600" fill="#0284c7">Preserves direct classical gradient highway</text>

    <text x="180" y="226" text-anchor="middle" font-size="12" font-weight="500" fill="#475569">Prevents representation collapse during</text>
    <text x="180" y="246" text-anchor="middle" font-size="12" font-weight="500" fill="#475569">quantum parameter optimization</text>
  </g>

  <!-- Arrow 5A -> 5B -->
  <line x1="720" y1="792" x2="720" y2="818" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 5B. Classical 64-D Output -->
  <g transform="translate(540, 820)">
    <rect width="360" height="66" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="180" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">Classical Branch Output</text>
    <text x="180" y="50" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0284c7">64-Dimensional Latent Vector [z_classical]</text>
  </g>

  <!-- Merge Branches to 6 (Late Hybrid Fusion) -->
  <path d="M 240 886 L 240 912 Q 240 924 255 924 L 465 924 Q 480 924 480 934 L 480 946" fill="none" stroke="#7c3aed" stroke-width="2.4"/>
  <path d="M 720 886 L 720 912 Q 720 924 705 924 L 495 924 Q 480 924 480 934 L 480 946" fill="none" stroke="#0284c7" stroke-width="2.4" marker-end="url(#arr-green)"/>

  <!-- ================= 6. LATE HYBRID FUSION LAYER ================= -->
  <g transform="translate(190, 950)">
    <rect width="580" height="88" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2.2"/>
    <text x="290" y="29" text-anchor="middle" font-size="15.5" font-weight="700" fill="#065f46">Late Hybrid Feature Fusion (Concatenation)</text>
    <text x="290" y="51" text-anchor="middle" font-size="13.5" font-weight="700" fill="#047857">torch.cat([ 8-D Quantum, 64-D Classical ])</text>
    <text x="290" y="72" text-anchor="middle" font-size="12.5" font-weight="600" fill="#059669">72-Dimensional Unified Hybrid Representation Vector</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <line x1="480" y1="1038" x2="480" y2="1068" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- ================= 7. CLASSIFIER HEAD ================= -->
  <g transform="translate(240, 1070)">
    <rect width="480" height="70" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/>
    <text x="240" y="29" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Final Classification Head</text>
    <text x="240" y="51" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">Linear Layer (72 → 4 Logits) + Calibrated Softmax</text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <line x1="480" y1="1140" x2="480" y2="1170" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- ================= 8. FOUR-CLASS PREDICTION ================= -->
  <g transform="translate(130, 1172)">
    <rect width="700" height="136" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.2"/>
    <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#92400e">Four-Class Oral Lesion Diagnostic Stratification</text>
    
    <g transform="translate(24, 46)">
      <!-- Healthy -->
      <rect x="0" y="0" width="150" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
      <circle cx="18" cy="20" r="5" fill="#10b981"/>
      <text x="30" y="24" font-size="12.5" font-weight="700" fill="#0f172a">Healthy</text>
      <text x="12" y="44" font-size="11" font-weight="700" fill="#059669">98.40% Specificity</text>
      <text x="12" y="60" font-size="10" font-weight="500" fill="#64748b">No Intervention</text>

      <!-- Benign -->
      <rect x="168" y="0" width="150" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
      <circle cx="186" cy="20" r="5" fill="#3b82f6"/>
      <text x="198" y="24" font-size="12.5" font-weight="700" fill="#0f172a">Benign Lesion</text>
      <text x="180" y="44" font-size="11" font-weight="700" fill="#2563eb">84.20% F1-Score</text>
      <text x="180" y="60" font-size="10" font-weight="500" fill="#64748b">14-Day Surveillance</text>

      <!-- OPMD -->
      <rect x="336" y="0" width="150" height="72" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="354" cy="20" r="5" fill="#f59e0b"/>
      <text x="366" y="24" font-size="12.5" font-weight="700" fill="#0f172a">OPMD Pre-Cancer</text>
      <text x="348" y="44" font-size="11" font-weight="700" fill="#d97706">78.60% F1-Score</text>
      <text x="348" y="60" font-size="10" font-weight="500" fill="#64748b">Biopsy Priority</text>

      <!-- OCA -->
      <rect x="504" y="0" width="150" height="72" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
      <circle cx="522" cy="20" r="5" fill="#ef4444"/>
      <text x="534" y="24" font-size="12.5" font-weight="700" fill="#0f172a">Oral Cancer (OCA)</text>
      <text x="516" y="44" font-size="11" font-weight="700" fill="#dc2626">89.40% SOTA F1</text>
      <text x="516" y="60" font-size="10" font-weight="500" fill="#64748b">Urgent Oncology</text>
    </g>
  </g>
</svg>
